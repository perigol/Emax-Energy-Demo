services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: norteluz
      POSTGRES_PASSWORD: norteluz
      POSTGRES_DB: norteluz
    ports:
      - "5433:5432"
    volumes:
      - norteluz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norteluz -d norteluz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  norteluz_pg:
